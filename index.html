<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewCosmo Store | Premium Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .cart-open { transform: translateX(0%); }
        .cart-closed { transform: translateX(100%); }
        .transition-all-custom { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .faq-answer.open { max-height: 200px; }
        .premium-gradient { background: linear-gradient(135deg, #111827 0%, #1f2937 100%); }
        .gold-gradient-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #splashScreen { position: fixed; inset: 0; background: #0b0f19; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease, visibility 0.6s; }
        .skeleton { background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-x-hidden">

    <!-- SPLASH SCREEN -->
    <div id="splashScreen">
        <div class="text-center space-y-6 animate-pulse">
            <div class="bg-gradient-to-br from-amber-400 to-amber-600 text-black p-6 rounded-3xl inline-block shadow-2xl">
                <i class="fa-solid fa-crown text-5xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white">New<span class="text-amber-400">Cosmo</span>.</h1>
        </div>
    </div>

    <!-- NAVBAR PREMIUM -->
    <nav class="bg-white/80 backdrop-blur-lg sticky top-0 z-40 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" onclick="location.reload()" class="text-2xl font-black">New<span class="text-amber-500">Cosmo</span>.</a>
            <div class="flex items-center gap-4">
                <button onclick="toggleCart(true)" class="relative p-2 hover:bg-gray-100 rounded-full transition">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="cartCount" class="absolute top-0 right-0 bg-amber-500 text-[10px] w-5 h-5 flex items-center justify-center rounded-full text-white font-bold">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Productos generados dinámicamente -->
        </div>
    </main>

    <!-- CARRITO SLIDEOUT -->
    <div id="cartModal" class="fixed inset-y-0 right-0 w-full sm:w-[400px] bg-white shadow-2xl cart-closed transition-transform duration-300 z-50 p-6 flex flex-col border-l">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Tu Bolsa</h2>
            <button onclick="toggleCart(false)" class="text-2xl">&times;</button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto space-y-4"></div>
        <button onclick="enviarWhatsApp()" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold mt-4">Continuar pedido</button>
    </div>

    <script>
        const TELEFONO_WHATSAPP = "51999999999"; 
        const dbMock = [
            { id: 1, nombre: "Auriculares Pro", precio: 59.90, categoria: "Tecnología", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" },
            { id: 2, nombre: "Smartwatch", precio: 89.50, categoria: "Tecnología", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
            { id: 3, nombre: "Zapatillas", precio: 145.00, categoria: "Moda", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" },
            { id: 4, nombre: "Cafetera Pro", precio: 135.00, categoria: "Hogar", img: "https://images.unsplash.com/photo-1517256064527-09c53b2d0bc6?w=500&q=80" }
        ];

        let carrito = JSON.parse(localStorage.getItem('newcosmo_cart')) || [];

        function renderProductos() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = dbMock.map(p => `
                <div class="bg-white p-4 rounded-2xl border hover:shadow-lg transition">
                    <img src="${p.img}" class="w-full h-48 object-cover rounded-xl mb-4">
                    <h3 class="font-bold">${p.nombre}</h3>
                    <p class="text-amber-600 font-black">S/ ${p.precio.toFixed(2)}</p>
                    <button onclick="agregarAlCarrito(${p.id})" class="w-full mt-4 bg-gray-900 text-white py-2 rounded-lg text-sm">Añadir</button>
                </div>
            `).join('');
            document.getElementById('splashScreen').style.opacity = '0';
            setTimeout(() => document.getElementById('splashScreen').style.display = 'none', 600);
        }

        function agregarAlCarrito(id) {
            const prod = dbMock.find(p => p.id === id);
            carrito.push(prod);
            localStorage.setItem('newcosmo_cart', JSON.stringify(carrito));
            actualizarUI();
            toggleCart(true);
        }

        function actualizarUI() {
            document.getElementById('cartCount').innerText = carrito.length;
            const container = document.getElementById('cartItems');
            container.innerHTML = carrito.map(item => `
                <div class="flex justify-between items-center border-b pb-2">
                    <span>${item.nombre}</span>
                    <span class="font-bold">S/ ${item.precio}</span>
                </div>
            `).join('');
        }

        function toggleCart(abrir) {
            const modal = document.getElementById('cartModal');
            abrir ? modal.classList.replace('cart-closed', 'cart-open') : modal.classList.replace('cart-open', 'cart-closed');
        }

        function enviarWhatsApp() {
            const msg = `Pedido: ${carrito.map(i => i.nombre).join(', ')}`;
            window.open(`https://api.whatsapp.com/send?phone=${TELEFONO_WHATSAPP}&text=${encodeURIComponent(msg)}`);
        }

        window.onload = () => { renderProductos(); actualizarUI(); };
    </script>
</body>
</html>
