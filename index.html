<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewCosmo Store | Premium Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Estilos del Splash Screen */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: #0b0f19;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .splash-logo-pulse { animation: pulse-gold 2s infinite ease-in-out; }
        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.2)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.6)); }
        }
        .skeleton {
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-hidden">

    <!-- SPLASH SCREEN -->
    <div id="splashScreen">
        <div class="text-center space-y-6">
            <div class="splash-logo-pulse bg-gradient-to-br from-amber-400 to-amber-600 text-black p-6 rounded-3xl inline-block shadow-2xl">
                <i class="fa-solid fa-crown text-5xl"></i>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold text-white">New<span class="text-amber-400">Cosmo</span>.</h1>
                <p class="text-gray-400 text-xs uppercase tracking-widest mt-2">Cargando Experiencia Premium</p>
            </div>
            <div class="w-32 h-1.5 bg-gray-800 rounded-full mx-auto overflow-hidden">
                <div class="h-full bg-amber-500 rounded-full skeleton w-full"></div>
            </div>
        </div>
    </div>

    <!-- Resto del contenido de tu sitio aquí... -->

    <script>
        // Función para ocultar el splash con efecto de desvanecimiento
        function desactivarSplashScreen() {
            const splash = document.getElementById('splashScreen');
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            document.body.classList.remove('overflow-hidden'); // Habilita el scroll
        }

        // Simulación de carga inicial
        window.onload = () => {
            setTimeout(() => {
                desactivarSplashScreen();
            }, 1800); // El tiempo coincide con la carga de tus datos
        };
    </script>
</body>
</html>
