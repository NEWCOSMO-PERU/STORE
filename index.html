<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewCosmo Store | Premium Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .cart-open { transform: translateX(0%); }
        .cart-closed { transform: translateX(100%); }
        .transition-all-custom { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        .faq-answer.open { max-height: 200px; }
        .premium-gradient { background: linear-gradient(135deg, #111827 0%, #1f2937 100%); }
        .gold-gradient-text { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Estilos del Splash Screen */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: #0b0f19;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .splash-logo-pulse { animation: pulse-gold 2s infinite ease-in-out; }
        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.2)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.6)); }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #111827; border-radius: 10px; }
        .skeleton {
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 selection:bg-amber-500 selection:text-white overflow-hidden">

    <div id="splashScreen">
        <div class="text-center space-y-6">
            <div class="splash-logo-pulse bg-gradient-to-br from-amber-400 to-amber-600 text-black p-6 rounded-3xl inline-block shadow-2xl">
                <i class="fa-solid fa-crown text-5xl"></i>
            </div>
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white">New<span class="text-amber-400">Cosmo</span>.</h1>
                <p class="text-gray-400 text-xs uppercase tracking-widest mt-2">Cargando Experiencia Premium</p>
            </div>
            <div class="w-32 h-1.5 bg-gray-800 rounded-full mx-auto overflow-hidden">
                <div class="h-full bg-amber-500 rounded-full skeleton w-full"></div>
            </div>
        </div>
    </div>

    <div class="bg-amber-500 text-black text-center text-xs font-bold tracking-widest py-2 px-4 uppercase">
        ✨ Envíos express garantizados & Garantía de satisfacción premium ✨
    </div>

    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-40 border-b border-gray-100 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="#" onclick="cambiarCategoria('Todos')" class="flex items-center gap-3 group">
                <div class="bg-gradient-to-br from-gray-900 to-black text-amber-400 p-2.5 rounded-2xl group-hover:from-amber-500 group-hover:to-amber-600 group-hover:text-black shadow-md transition-all duration-300">
                    <i class="fa-solid fa-crown text-xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-black tracking-tight text-gray-900 leading-none">New<span class="text-amber-500">Cosmo</span>.</span>
                    <span class="text-[9px] text-gray-400 tracking-widest uppercase font-bold">Store Premium</span>
                </div>
            </a>
            <div class="hidden md:block w-1/3 relative">
                <input type="text" id="searchInput" oninput="procesarFiltrosYOrden()" placeholder="Busca la excelencia aquí..." class="w-full pl-12 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-full focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400 text-sm"></i>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="filtrarFavoritos()" class="relative p-2 text-gray-600 hover:text-red-500 transition-colors"><i class="fa-regular fa-heart text-2xl"></i><span id="favCount" class="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-white">0</span></button>
                <button onclick="toggleCart(true)" class="relative p-2 text-gray-600 hover:text-gray-900 transition-colors"><i class="fa-solid fa-bag-shopping text-2xl"></i><span id="cartCount" class="absolute top-0 right-0 bg-amber-500 text-black text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-white">0</span></button>
            </div>
        </div>
    </nav>

    <script>
        // Función para ocultar Splash y mostrar contenido
        function desactivarSplashScreen() {
            const splash = document.getElementById('splashScreen');
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            document.body.classList.remove('overflow-hidden');
        }

        // Carga inicial
        window.onload = () => {
            // ... (resto de tus inicializaciones)
            setTimeout(() => {
                desactivarSplashScreen();
            }, 2000); // Tiempo de espera para la animación
        };
        
        // ... (resto de tu lógica JavaScript original)
    </script>
</body>
</html>
